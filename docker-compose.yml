services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "82:80"
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend