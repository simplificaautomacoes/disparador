services:
  backend:
    build: ./backend
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    volumes:
      - backend_data:/app/data
      
  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_data: