services:
  backend:
    build: ./backend
    ports:
      - "8007:8000"
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "87:80"
    environment:
      - BACKEND_URL=http://backend:8007
    restart: unless-stopped
    depends_on:
      - backend