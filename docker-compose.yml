services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8082}:8000"
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
      
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend